spring:

  datasource:

    url: jdbc:mysql://localhost:3306/shopping_cart_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata

    username: root

    password: root

    driver-class-name: com.mysql.cj.jdbc.Driver

