spring:

  datasource:

    url: ${DB_URL}

    username: ${DB_USERNAME}

    password: ${DB_PASSWORD}

    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:

    hibernate:
      ddl-auto: validate

    show-sql: false

    properties:

      hibernate:

        "[format_sql]": false

        dialect: org.hibernate.dialect.MySQLDialect

    open-in-view: false



  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}